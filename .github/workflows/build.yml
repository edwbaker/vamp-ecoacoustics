name: Build Vamp Plugins

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main, master ]

jobs:
  build-native:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        include:
          - os: ubuntu-latest
            platform: linux
            artifact_name: vamp-ecoacoustics.so
          - os: macos-latest
            platform: macos
            artifact_name: vamp-ecoacoustics.dylib
          - os: windows-latest
            platform: windows
            artifact_name: vamp-ecoacoustics.dll

    steps:
    - uses: actions/checkout@v7

    - name: Build (non-Windows)
      if: matrix.os != 'windows-latest'
      run: make PLATFORM=${{ matrix.platform }}

    - name: Build (MSVC)
      if: matrix.os == 'windows-latest'
      shell: powershell
      run: |
        # No -G: use whichever Visual Studio the runner image has
        cmake -S . -B build -A x64
        cmake --build build --config Release
        Copy-Item -Path "build\Release\vamp-ecoacoustics.dll" -Destination "${{ github.workspace }}\${{ matrix.artifact_name }}" -Force

    - name: Test (non-Windows)
      if: matrix.os != 'windows-latest'
      run: make test PLATFORM=${{ matrix.platform }}

    - name: Test (MSVC)
      if: matrix.os == 'windows-latest'
      shell: powershell
      run: |
        cmake --build build --config Release --target test_indices
        ctest --test-dir build -C Release --output-on-failure

    - name: Upload Artifact
      uses: actions/upload-artifact@v7
      with:
        name: ${{ matrix.platform }}-build
        path: ${{ matrix.artifact_name }}

  build-wasm:
    name: Build WASM
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    
    - name: Setup Emscripten
      uses: emscripten-core/setup-emsdk@v16
    
    - name: Build
      run: make PLATFORM=wasm

    - name: Upload Artifact
      uses: actions/upload-artifact@v7
      with:
        name: wasm-build
        path: vamp-ecoacoustics.wasm

  release:
    name: Create Release
    needs: [build-native, build-wasm]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    steps:
      - name: Download Artifacts
        uses: actions/download-artifact@v8
        with:
          path: release-assets
          merge-multiple: true

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          files: release-assets/*

  cdn:
    name: Publish to cdn.audioblast.org
    needs: build-wasm
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: wasm-build
          path: dist

      # The CDN is served from the audioblast/cdn.audioblast.org repo, laid out as
      # <library>/<version>/. Pushing needs a token with contents:write on that repo,
      # stored as the CDN_DEPLOY_TOKEN secret.
      - uses: actions/checkout@v7
        with:
          repository: audioblast/cdn.audioblast.org
          token: ${{ secrets.CDN_DEPLOY_TOKEN }}
          path: cdn

      - name: Copy versioned files
        run: |
          version="${GITHUB_REF_NAME#v}"
          target="cdn/vamp-ecoacoustics/${version}"
          if [ -e "$target" ]; then
            echo "$target already exists; CDN versions are immutable"
            exit 1
          fi
          mkdir -p "$target"
          cp dist/vamp-ecoacoustics.wasm LICENSE "$target/"

      - name: Commit and push
        working-directory: cdn
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add vamp-ecoacoustics
          git commit -m "Add vamp-ecoacoustics ${GITHUB_REF_NAME}"
          git push origin HEAD:master
          # GitHub Pages serves the release branch. It is deliberately not pushed here:
          # promoting master to release (a fast-forward) is the manual step that goes live.
